name: Windows tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Regression tests (no microphone or desktop input)
        run: python -m pytest -q
      - name: Build source wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
